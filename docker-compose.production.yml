services:
  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to the published frontend image}
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      PYTHON_SERVICE_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  api:
    image: ${API_IMAGE:?Set API_IMAGE to the published API image}
    env_file:
      - ./python-service/.env
    expose:
      - "8000"
    restart: unless-stopped

  worker:
    image: ${API_IMAGE:?Set API_IMAGE to the published API image}
    env_file:
      - ./python-service/.env
    command: ["python", "-m", "app.worker", "--loop"]
    healthcheck:
      disable: true
    restart: unless-stopped
